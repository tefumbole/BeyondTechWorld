# Insert inside the beyondtechworld.com HTTPS server, before location /.
# The live site stays on Laravel. These locations only publish the system test.
# Applied on the server in /etc/nginx/sites-available/beyondtechworld.

location ^~ /system-test {
    root /var/www/beyondtechworld/dist;
    try_files /index.html =404;
}

location ^~ /admin/help {
    root /var/www/beyondtechworld/dist;
    try_files /index.html =404;
}

location ^~ /assets/ {
    root /var/www/beyondtechworld/dist;
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

location ^~ /api/system-test {
    proxy_pass http://127.0.0.1:3004/system-test;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25M;
}
