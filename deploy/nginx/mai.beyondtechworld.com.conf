# Whats MAI customer portal. The WaSender business line stays on beyondtechworld.com.
# Point DNS at this host only after the morning check. Do not put secrets in this file.

server {
    listen 80;
    listen [::]:80;
    server_name mai.beyondtechworld.com;
    return 301 https://mai.beyondtechworld.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mai.beyondtechworld.com;

    # Issue the certificate before enabling this file, for example:
    # certbot certonly --webroot -w /var/www/beyondtechworld/laravel-app/public -d mai.beyondtechworld.com
    ssl_certificate /etc/letsencrypt/live/mai.beyondtechworld.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mai.beyondtechworld.com/privkey.pem;

    root /var/www/beyondtechworld/laravel-app/public;
    index index.php;
    client_max_body_size 12m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php7.4-fpm.sock;
        fastcgi_param HTTPS on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
